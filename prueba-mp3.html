<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba MP3 · Mi Entrenador</title><style>body{font:17px system-ui;background:#edf5f0;color:#143b30;margin:0;padding:22px}main{max-width:560px;margin:auto}section{background:white;padding:22px;border-radius:20px}audio{width:100%;margin:18px 0}button{background:#158567;color:white;border:0;border-radius:12px;padding:14px;font:600 17px system-ui;width:100%}p{line-height:1.5}small{color:#607a6f}</style></head><body><main><h1>🎵 Prueba de audio MP3</h1><section><p>Esta prueba usa un archivo de audio real, no sonidos generados. Es un efecto sonoro corto para comprobar la compatibilidad antes de incorporar música.</p><audio id="player" controls preload="none" src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3"></audio><button id="test">▶ Reproducir audio</button><p id="status">Pulsa reproducir y sube el volumen multimedia.</p><small>Archivo de demostración de MDN (CC0). Mi Entrenador no se ha modificado.</small></section></main><script>const p=document.getElementById('player'),s=document.getElementById('status');document.getElementById('test').onclick=async()=>{try{await p.play();s.textContent='Reproduciendo MP3. ¿Se oye el sonido?'}catch(e){s.textContent='Error: '+e.message}};p.onplaying=()=>s.textContent='El reproductor indica reproducción activa';p.onerror=()=>s.textContent='Error cargando MP3 (código '+(p.error?.code||'?')+')';p.onended=()=>s.textContent='Audio finalizado';</script></body></html>
